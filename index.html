<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ek gift sirf tumhare liye</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#3b0a2e;--bg2:#8e1b4f;--rose:#ff4d8d;--gold:#ffd27a;--ink:#fff4f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 35%,var(--bg2),var(--bg1) 75%);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;user-select:none}
h1{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(26px,6vw,44px);margin:0 16px 4px;text-shadow:0 4px 24px #ff4d8d88}
.hint{margin:0 16px;opacity:.85;font-weight:600;transition:opacity .4s}
.scene{width:300px;height:300px;perspective:900px;margin-top:10px;cursor:pointer;transition:transform .9s,opacity .9s;position:relative;z-index:2}
.gift{position:absolute;inset:0;transform-style:preserve-3d;animation:spin 7s linear infinite;transform:rotateX(-22deg)}
@keyframes spin{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}
.part{position:absolute;left:50%;top:50%;transform-style:preserve-3d;width:0;height:0}
.f{position:absolute;display:flex;align-items:center;justify-content:center;backface-visibility:hidden}
.body .f{background:linear-gradient(90deg,transparent 40%,var(--gold) 40% 60%,transparent 60%),linear-gradient(160deg,#ff5c97,#d81b60)}
.lid .f{background:linear-gradient(90deg,transparent 38%,var(--gold) 38% 62%,transparent 62%),linear-gradient(160deg,#ff7aa9,#e8336f);border:1px solid #ffffff33}
.lid .top{background:linear-gradient(90deg,transparent 38%,var(--gold) 38% 62%,transparent 62%),linear-gradient(0deg,transparent 38%,var(--gold) 38% 62%,transparent 62%),#f0457f}
.lid{transition:transform 1.1s cubic-bezier(.3,1.4,.5,1),opacity 1s .4s}
.bow i{position:absolute;width:56px;height:34px;left:-28px;top:-17px;border:9px solid var(--gold);border-radius:50%;transform-origin:center}
.bow .a{transform:translate(-26px,0) rotate(-25deg)}.bow .b{transform:translate(26px,0) rotate(25deg)}
.bow s{position:absolute;width:24px;height:24px;left:-12px;top:-12px;background:var(--gold);border-radius:50%}
.bowwrap{position:absolute;left:0;top:0;transform-style:preserve-3d}
.bowwrap.p2{transform:rotateY(90deg)}
.lid.open{transform:translate(120px,-190px) rotateZ(35deg);opacity:0}
.scene.gone{transform:scale(.4) translateY(120px);opacity:0;pointer-events:none}
.shadow{position:absolute;left:50%;bottom:20px;width:200px;height:30px;margin-left:-100px;background:radial-gradient(#0008,transparent 70%);filter:blur(4px)}
/* modal */
.ov{position:fixed;inset:0;background:#1a0212cc;backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:20}
.ov.on{display:flex}
.card{background:linear-gradient(160deg,#fff,#ffe0ec);color:#5a0b30;border-radius:28px;padding:34px 28px;width:min(88vw,380px);box-shadow:0 20px 70px #000a,0 0 0 4px #ffffff55;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.card h2{font-family:'Pacifico',cursive;font-weight:400;margin:0 0 6px;font-size:30px;line-height:1.3}
.card p{margin:0 0 24px;font-weight:600;opacity:.75}
.btns{display:flex;gap:16px;justify-content:center;min-height:56px}
button{font:800 18px 'Nunito',sans-serif;border:0;border-radius:40px;padding:14px 34px;cursor:pointer;transition:transform .15s}
.yes{background:linear-gradient(135deg,#ff4d8d,#e0245e);color:#fff;box-shadow:0 8px 20px #e0245e66}
.yes:hover{transform:scale(1.08)}
.no{background:#fff;color:#8a2b55;box-shadow:inset 0 0 0 2px #e9a9c0}
.no.run{position:fixed;z-index:30;transition:left .2s,top .2s;touch-action:none}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* reveal */
.reveal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;perspective:1100px;pointer-events:none}
.reveal.on{display:flex}
.pic{position:relative;width:min(74vw,400px);aspect-ratio:620/758;border-radius:22px;box-shadow:0 25px 70px #000a,0 0 60px #ff4d8d88;animation:intro 1.6s cubic-bezier(.2,.9,.3,1) both,sway 5s ease-in-out 1.6s infinite alternate;transform-style:preserve-3d;overflow:hidden}
.pic img{width:100%;height:100%;display:block}
@keyframes intro{from{transform:translateY(300px) rotateY(-540deg) scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes sway{from{transform:rotateY(-18deg) translateY(0)}to{transform:rotateY(18deg) translateY(-12px)}}
.wish{position:absolute;left:20.5%;top:44.5%;width:58%;height:26%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#b3123f;font-family:'Pacifico',cursive;line-height:1.15;font-size:clamp(20px,5.2vw,34px)}
.wish small{font:800 clamp(11px,2.6vw,15px) 'Nunito',sans-serif;color:#8a4a30;margin-top:6px}
.heart{position:fixed;bottom:-40px;pointer-events:none;z-index:1;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.gift,.pic{animation-duration:30s}}
.spark{position:fixed;pointer-events:none;z-index:50;animation:sp 1s forwards}
@keyframes sp{to{transform:translateY(-60px) scale(.3);opacity:0}}
#mus{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;background:#ffffff22;color:#fff;font-size:20px;padding:8px 13px;border-radius:50%;backdrop-filter:blur(4px)}
#next{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;z-index:12;white-space:nowrap;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
#next.on{display:block}
#c2{max-height:88vh;overflow:auto}
.letter{font-weight:600;line-height:1.7;text-align:left;font-size:17px;min-height:190px;white-space:pre-wrap}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.wc{padding:12px 8px;font-size:14px;border-radius:18px;background:#fff;color:#8a2b55;box-shadow:inset 0 0 0 2px #f2b5cb}
#cw{width:100%;padding:13px 16px;border-radius:30px;border:2px solid #e9a9c0;font:600 16px 'Nunito',sans-serif;color:#5a0b30}
.promise{font-family:'Pacifico',cursive;font-size:26px;color:#d81b60;border:3px dashed #e9a9c0;border-radius:20px;padding:20px;margin:6px 0 16px;line-height:1.3}
a.yes{display:inline-block;text-decoration:none;font:800 17px 'Nunito',sans-serif;border-radius:40px;padding:14px 26px;color:#fff}
</style>

const $=id=>document.getElementById(id);
function face(p,w,h,tf,cls){const d=document.createElement('div');d.className='f '+(cls||'');d.style.cssText=`width:${w}px;height:${h}px;margin:${-h/2}px 0 0 ${-w/2}px;transform:${tf}`;p.appendChild(d)}
function box(cls,w,h,y){const p=document.createElement('div');p.className='part '+cls;p.style.transform=`translateY(${y}px)`;
 const z=w/2;
 face(p,w,h,`translateZ(${z}px)`);face(p,w,h,`rotateY(180deg) translateZ(${z}px)`);
 face(p,w,h,`rotateY(90deg) translateZ(${z}px)`);face(p,w,h,`rotateY(-90deg) translateZ(${z}px)`);
 face(p,w,w,`rotateX(90deg) translateZ(${h/2}px)`,'top');face(p,w,w,`rotateX(-90deg) translateZ(${h/2}px)`,'bot');
 $('gift').appendChild(p);return p}

['','p2'].forEach(c=>{const w=document.createElement('div');w.className='bowwrap '+c;w.style.transform=(c?'rotateY(90deg) ':'')+'translateY(-62px)';w.innerHTML='<i class="a"></i><i class="b"></i><s></s>';lid.appendChild(w)});

function hearts(n){for(let i=0;i<n;i++){const h=document.createElement('div');h.className='heart';h.textContent=['💖','💗','💕','❤️','🌹'][i%5];
 h.style.left=Math.random()*100+'vw';h.style.fontSize=14+Math.random()*26+'px';h.style.animationDuration=5+Math.random()*7+'s';h.style.animationDelay=Math.random()*3+'s';
 document.body.appendChild(h);setTimeout(()=>h.remove(),16000)}}

 {q:'Do you love me? 💗',s:'Sach sach batana...',y:'Yes 😍',n:'No 😈'},
 {q:'Sorry 🥺',s:'Galti ho gayi, ab maaf kar do na...',y:'Accept 🤗',n:'Decline 😤'}
];
function show(){const s=steps[step];$('q').textContent=s.q;$('sub').textContent=s.s;$('b1').textContent=s.y;$('b2').textContent=s.n;
 const b=$('b2');b.classList.remove('run');b.style.left=b.style.top='';}
$('scene').onclick=()=>{step=0;show();$('ov').classList.add('on');$('hint').style.opacity=0};
function dodge(e){
 e.preventDefault();e.stopPropagation();
 const b=$('b2'),y=$('b1').getBoundingClientRect();
 const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
 const px=t.clientX==null?-999:t.clientX,py=t.clientY==null?-999:t.clientY;
 const w=b.offsetWidth,h=b.offsetHeight,W=innerWidth,H=innerHeight;
 b.classList.add('run');
 let x,yy,ok=false;
 for(let i=0;i<40&&!ok;i++){
  x=8+Math.random()*Math.max(1,W-w-16);yy=8+Math.random()*Math.max(1,H-h-16);
  const far=Math.hypot(x+w/2-px,yy+h/2-py)>150;
  const clearYes=x>y.right+20||x+w<y.left-20||yy>y.bottom+20||yy+h<y.top-20;
  ok=far&&clearYes}
 b.style.left=x+'px';b.style.top=yy+'px';
 if(navigator.vibrate)navigator.vibrate(25)}
['pointerenter','pointerdown','mouseenter'].forEach(ev=>$('b2').addEventListener(ev,dodge));
['touchstart','touchmove','touchend'].forEach(ev=>$('b2').addEventListener(ev,dodge,{passive:false}));

function spark(x,y){const s=document.createElement('div');s.className='spark';s.textContent=['💗','✨','💖'][Math.random()*3|0];s.style.left=x-8+'px';s.style.top=y-8+'px';s.style.fontSize=12+Math.random()*10+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}
const o2=$('ov2'),c2=$('c2');
$('next').onclick=()=>{$('next').classList.remove('on');openLetter()};
function openLetter(){
 c2.innerHTML='<h2>Meri maafi 💌</h2><div class="letter" id="lt"></div><div class="btns" style="margin-top:18px"><button class="yes" id="wb" style="display:none">Ab wish maango ✨</button></div>';
 o2.classList.add('on');
 const el=$('lt');let i=0;
 const fin=()=>{clearInterval(t);el.textContent=LETTER;$('wb').style.display=''};
 const t=setInterval(()=>{el.textContent=LETTER.slice(0,++i);if(i>=LETTER.length)fin()},24);
 el.onclick=fin;$('wb').onclick=openWish}
const W=[];
function openWish(){
 c2.innerHTML='<h2>Ek wish maango ✨</h2><p>Maaf karne ke badle jo chaho wo mil jayega</p><div class="wg">'+W.map(w=>'<button class="wc">'+w+'</button>').join('')+'</div><input id="cw" placeholder="Ya apni wish likho..." maxlength="80" style="color: white"><div class="btns" style="margin-top:14px"><button class="yes" id="cb">Yehi chahiye 💖</button></div>';
 document.querySelectorAll('.wc').forEach(b=>b.onclick=()=>grant(b.textContent));
 $('cb').onclick=()=>{const v=$('cw').value.trim();if(v)grant(v);else $('cw').focus()}}
function grant(w){hearts(50);
 const msg='Maaf kar diya 😘 Meri wish: '+w+' — yaad rakhna, promise tha! 💖';
 c2.innerHTML='<h2>Wish granted ✨</h2><div class="promise" id="pr"></div><p>Ye promise lifetime valid hai 💍<br>Screenshot rakh lo, kabhi bhi maang sakti ho 😘</p><div class="btns"><a class="yes" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(msg)+'">WhatsApp par bhejo 💬</a></div>';
 $('pr').textContent=w}
</script>
</body>
